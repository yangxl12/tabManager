<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>RUNNING</title>
    <style>
      body {
        margin: 0;
        font: 12px/1.6 ui-monospace, monospace;
      }
      #stage {
        position: absolute;
        left: 0;
        top: 0;
        width: 900px;
        height: 900px;
        overflow: hidden;
      }
      iframe {
        width: 1680px;
        height: 900px;
        border: 0;
        transform: scale(0.53);
        transform-origin: top left;
      }
      #log {
        position: fixed;
        right: 0;
        top: 0;
        width: 740px;
        height: 100vh;
        overflow: auto;
        background: #111;
        color: #9f9;
        margin: 0;
        padding: 10px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="stage"><iframe id="app" src="/src/newtab/index.html"></iframe></div>
    <pre id="log"></pre>
    <script>
      const logEl = document.getElementById('log');
      const out = [];
      const errors = [];
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      function log(ok, label, extra) {
        out.push(`${ok ? 'PASS' : 'FAIL'}  ${label}${extra ? ' :: ' + extra : ''}`);
        logEl.textContent = out.join('\n');
      }
      function setInput(el, value) {
        const desc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value');
        desc.set.call(el, value);
        el.dispatchEvent(new Event('input', { bubbles: true }));
      }

      const frame = document.getElementById('app');
      let D;
      let started = false;
      const $ = (s) => D.querySelector(s);
      const $$ = (s) => [...D.querySelectorAll(s)];
      const cards = () => $$('[data-bm-card]');
      const bmCardById = (id) => D.querySelector(`[data-bm-card="${id}"] .bm-card`);
      const headerBtn = (text) => $$('.pane-main .sec-ops .btn').find((b) => b.textContent.includes(text));
      const tabBtn = (text) => $$('.pane-tabs .sec-ops .btn').find((b) => b.textContent.includes(text));

      frame.addEventListener('load', async () => {
        D = frame.contentDocument;
        if (!D || D.location.pathname.indexOf('index.html') < 0) return;
        if (started) return;
        started = true;
        out.length = 0;
        const W = frame.contentWindow;
        W.addEventListener('error', (e) =>
          errors.push('iframe:' + (e.error && e.error.stack ? e.error.stack : e.message)),
        );
        const origErr = W.console.error;
        W.console.error = (...a) => {
          errors.push('console:' + a.map(String).join(' '));
          origErr.apply(W.console, a);
        };
        const origWarn = W.console.warn;
        W.console.warn = (...a) => {
          errors.push('warn:' + a.map(String).join(' '));
          origWarn.apply(W.console, a);
        };
        W.addEventListener('unhandledrejection', (e) =>
          errors.push('reject:' + (e.reason && e.reason.stack ? e.reason.stack : String(e.reason))),
        );
        // 把每条 toast 文案记下来，便于定位失败原因
        const seenToasts = new Set();
        const toastObserver = new MutationObserver(() => {
          D.querySelectorAll('.toast__msg').forEach((el) => {
            const t = el.textContent || '';
            if (t && !seenToasts.has(t)) {
              seenToasts.add(t);
              out.push(`TOAST  ${t}`);
              logEl.textContent = out.join('\n');
            }
          });
        });
        toastObserver.observe(D.body, { childList: true, subtree: true });

        await sleep(1200);

        try {
          /* ---------- 首屏 ----------
             基准数一律现取：devSeed 的数据会随调试需要增减，
             写死数字会让这些断言在「只是加了两条测试数据」时假红。 */
          const BASE_TABS = $$('[data-tab-card]').length;
          const BASE_BM = cards().length;
          const BASE_ROWS = $$('.tree-row').length;
          log(BASE_BM >= 8, '首屏渲染书签卡片（≥8 张）', `实际 ${BASE_BM}`);
          log(
            BASE_TABS > 0 && BASE_TABS === W.__tabnest.getState().tabs.length,
            '首屏渲染的标签卡片数 = store 中非自身标签数',
            `卡片 ${BASE_TABS} / store ${W.__tabnest.getState().tabs.length}`,
          );
          log(BASE_ROWS >= 5, '书签树按展开状态渲染行（≥5 行）', `实际 ${BASE_ROWS}`);
          log($$('.quick-tile').length === 9, '快捷站点 8 个 + 新增位', `实际 ${$$('.quick-tile').length}`);
          log($('.crumb') === null, '根层不显示面包屑');
          log(
            $$('.tree-group').length === 2,
            '顶层按账号 / 此设备分成两组',
            [...$$('.tree-group')].map((e) => e.textContent).join(' + '),
          );
          log(
            $$('.tree-group')[0].textContent === '账号书签' &&
              $$('.tree-group')[1].textContent === '此设备书签',
            '分组标题文案正确',
          );

          /* ---------- 自身标签页不进列表（回归：自己的新标签页出现在卡片里） ---------- */
          {
            const selfId = W.__tabnest.getState().selfTabId;
            log(!$(`[data-tab-card="${selfId}"]`), '自身标签页不出现在标签卡片里', `selfTabId=${selfId}`);
            await W.chrome.tabs.create({
              url: 'chrome-extension://tabnest-dev/src/newtab/index.html',
            });
            await sleep(300);
            log(
              $$('[data-tab-card]').length === BASE_TABS,
              '扩展自身页面靠 URL 兜底也被过滤',
              `实际 ${$$('[data-tab-card]').length}`,
            );
          }

          /* ---------- 拖拽指示互不串台（回归：左右面板闪烁） ---------- */
          const dragState = W.__tabnest.getState();
          // 书签卡 id '101'（掘金）与标签 id 101（GitHub）刻意同号，用来验串台
          dragState.setDrag({
            active: true,
            kind: 'bookmark',
            ids: ['104'],
            indicator: { kind: 'bookmark', targetId: '101', side: 'after' },
          });
          await sleep(150);
          log(
            !$('[data-tab-card="101"] .tab-card.drop-a'),
            '拖书签时左侧标签卡片不显示插入线',
          );
          log(
            !!$('[data-bm-card="101"] .bm-card.drop-a'),
            '拖书签时右侧同号书签卡片显示插入线',
          );

          dragState.setDrag({
            active: true,
            kind: 'tab',
            ids: ['101'],
            indicator: { kind: 'tab', targetId: '101', side: 'before' },
          });
          await sleep(150);
          log(
            !$('[data-bm-card="101"] .bm-card.drop-b'),
            '拖标签时右侧书签卡片不显示插入线',
          );
          log(
            !!$('[data-tab-card="101"] .tab-card.drop-b'),
            '拖标签时左侧同号标签卡片显示插入线',
          );
          log(
            !$('[data-bm-card="101"] .bm-card.dragging'),
            '拖标签时右侧卡片不进入拖拽半透明态',
          );

          // 经过标签面板空区时，右侧书签面板不应有任何高亮
          dragState.setDrag({ kind: 'tab', ids: ['101'], indicator: null, dropPane: 'tab' });
          await sleep(150);
          log(
            !$('.pane-main.drop-ready') && !$('.pane-main.drop-hint'),
            '拖标签经过左侧空区时右侧面板无高亮',
          );

          // 外部文件拖入 → 强提示
          dragState.setDrag({ kind: 'file', ids: [], indicator: null, dropPane: 'bookmark' });
          await sleep(150);
          log(!!$('.pane-main.drop-ready'), '外部文件拖入时右侧面板显示强提示');

          // 内部书签拖拽经过空区 → 弱提示
          dragState.setDrag({ kind: 'bookmark', ids: ['104'], indicator: null, dropPane: 'bookmark' });
          await sleep(150);
          log(
            !!$('.pane-main.drop-hint') && !$('.pane-main.drop-ready'),
            '内部拖书签经过空区时只显示虚线描边',
          );

          dragState.resetDrag();
          await sleep(150);
          log(
            !$('.pane-main.drop-ready') &&
              !$('.pane-main.drop-hint') &&
              !$('.drop-b') &&
              !$('.drop-a'),
            '拖拽结束后所有落点提示清除',
          );

          /* ---------- 标签 ---------- */
          $('[data-tab-card="101"] .tab-card').click();
          await sleep(150);
          log(
            $$('[data-tab-card]').length === BASE_TABS + 1,
            '单击标签卡片会新开标签',
            `实际 ${$$('[data-tab-card]').length}`,
          );
          $$('[data-tab-card]')[BASE_TABS].querySelector('.xbtn').click();
          await sleep(700);
          log(
            $$('[data-tab-card]').length === BASE_TABS,
            '关闭新开的标签后回到基准张数',
            `实际 ${$$('[data-tab-card]').length}`,
          );

          $('[data-tab-card="103"] .tab-card .xbtn').click();
          await sleep(80);
          log(!!$('[data-tab-card="103"] .tab-card.is-closing'), '关闭标签先播 is-closing 动画');
          await sleep(700);
          log(!$('[data-tab-card="103"]'), '动画结束后标签卡片移除');

          // 标签多选 → 批量关闭
          $('[data-tab-card="104"] .pick').click();
          $('[data-tab-card="105"] .pick').click();
          await sleep(120);
          log(!!$('.tab-grid.select-mode'), '勾选标签进入多选模式');
          log(!!tabBtn('关闭选中'), '标签工具条出现「关闭选中」');
          tabBtn('关闭选中').click();
          await sleep(900);
          log(
            $$('[data-tab-card]').length === BASE_TABS - 3,
            '批量关闭 2 个标签后剩（基准 - 3）张',
            `实际 ${$$('[data-tab-card]').length}`,
          );

          log(!$('.search'), '顶部全局搜索框已移除');

          /* ---------- 书签：单个删除 + 撤回 ---------- */
          const before = cards().length;
          bmCardById('100').querySelector('.xbtn').click();
          await sleep(800);
          log(cards().length === before - 1, '删除书签卡片', `${before} → ${cards().length}`);
          log(!!$('.toast__act'), '删除后出现撤回 toast');
          $('.toast__act').click();
          await sleep(700);
          log(cards().length === before, '撤回后卡片数量恢复', `实际 ${cards().length}`);
          log(
            [...$$('.bm-card__name')].some((n) => n.textContent === 'GitHub'),
            '撤回后书签内容还原',
          );

          /* ---------- 行内编辑（右下角编辑图标 → 名称 / 网址连改） ---------- */
          const card101 = bmCardById('101');
          const inp = (sel) => card101.querySelector(sel);
          const selAll = (el) => !!el && el.selectionStart === 0 && el.selectionEnd === el.value.length;
          const bmNode = (id) => W.__tabnest.getState().bm.nodes[id];
          const txt = (sel) => {
            const el = inp(sel);
            return el ? el.textContent : '(missing)';
          };
          card101.querySelector('.bm-card__edit').click();
          await sleep(150);
          const nameInput = inp('input:not(.soft)');
          log(
            !!nameInput && !!inp('input.soft'),
            '点击编辑图标后名称与网址同时变输入框',
          );
          log(D.activeElement === nameInput, '焦点自动落在名称输入框上');
          log(
            selAll(nameInput),
            '名称内容自动全选',
            nameInput ? `sel=${nameInput.selectionStart}-${nameInput.selectionEnd} len=${nameInput.value.length}` : '',
          );
          setInput(nameInput, '掘金 · 改名测试');
          nameInput.blur();
          await sleep(250);
          log(
            bmNode('101').title === '掘金 · 改名测试',
            'blur 提交名称修改',
            `store.title=${bmNode('101').title}`,
          );
          const urlFocus = inp('input.soft');
          log(D.activeElement === urlFocus, '名称确认后光标自动跳到网址输入框');
          log(
            selAll(urlFocus),
            '网址内容自动全选',
            urlFocus ? `sel=${urlFocus.selectionStart}-${urlFocus.selectionEnd} len=${urlFocus.value.length}` : '',
          );
          urlFocus.dispatchEvent(new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          await sleep(300);
          log(!inp('input'), 'Esc 退出编辑态');
          log(txt('.bm-card__host') === 'juejin.cn', 'Esc 取消编辑且不改动原值', txt('.bm-card__host'));

          /* 空值 blur：恢复原状，不把空串写进 store */
          card101.querySelector('.bm-card__edit').click();
          await sleep(150);
          const emptyName = inp('input:not(.soft)');
          setInput(emptyName, '');
          emptyName.blur();
          await sleep(200);
          log(D.activeElement === inp('input.soft'), '名称为空 blur 后光标仍交给网址输入框');
          const emptyUrl = inp('input.soft');
          setInput(emptyUrl, '   ');
          emptyUrl.blur();
          await sleep(250);
          log(!inp('input'), '网址为空 blur 后退出编辑态');
          log(
            txt('.bm-card__name') === '掘金 · 改名测试',
            '名称空值 blur 恢复原状',
            txt('.bm-card__name'),
          );
          log(txt('.bm-card__host') === 'juejin.cn', '网址空值 blur 恢复原状', txt('.bm-card__host'));

          /* 编辑态点卡片空白处：先收工，这一击不能再顺手打开书签 */
          {
            const tabsBeforeEditClick = $$('[data-tab-card]').length;
            card101.querySelector('.bm-card__edit').click();
            await sleep(150);
            inp('input:not(.soft)').blur(); // 名称确认 → 光标交给网址，此时网址框是最后一个字段
            await sleep(200);
            const urlBox = inp('input.soft');
            card101.dispatchEvent(new W.MouseEvent('mousedown', { bubbles: true }));
            if (urlBox) urlBox.blur();
            await sleep(200);
            card101.click();
            await sleep(400);
            log(!inp('input'), '点击卡片空白处结束编辑');
            log(
              $$('[data-tab-card]').length === tabsBeforeEditClick,
              '结束编辑那一击不会误开书签',
              `${tabsBeforeEditClick} → ${$$('[data-tab-card]').length}`,
            );
          }

          /* 单击名称 / 网址 = 开新标签（文字不再是编辑入口） */
          {
            const tabs0 = $$('[data-tab-card]').length;
            inp('.bm-card__name').click();
            await sleep(500);
            log(!inp('input'), '点名称不再进入编辑态');
            log(
              $$('[data-tab-card]').length === tabs0 + 1,
              '点名称打开新标签页',
              `${tabs0} → ${$$('[data-tab-card]').length}`,
            );
            const tabs1 = $$('[data-tab-card]').length;
            inp('.bm-card__host').click();
            await sleep(500);
            log(!inp('input'), '点网址不再进入编辑态');
            log(
              $$('[data-tab-card]').length === tabs1 + 1,
              '点网址打开新标签页',
              `${tabs1} → ${$$('[data-tab-card]').length}`,
            );
            // 收尾：关掉这两张测试标签，别扰动后面按数量断言的用例
            for (let i = 0; i < 2; i++) {
              const last = $$('[data-tab-card]').at(-1);
              if (last) last.querySelector('.xbtn').click();
              await sleep(600);
            }
            log(
              $$('[data-tab-card]').length === tabs0,
              '关掉测试开出的两个标签，张数还原',
              `实际 ${$$('[data-tab-card]').length} / 期望 ${tabs0}`,
            );
          }

          /* ---------- 全局书签搜索弹窗 ---------- */
          {
            $('.bm-search-btn').click();
            await sleep(350);
            log(!!$('.bmsearch'), '点击搜索图标打开全局书签搜索弹窗');
            const sInput = $('.bmsearch__field input');
            log(D.activeElement === sInput, '搜索框自动聚焦');
            log(
              $$('.bmsearch__field .ico-btn').length === 0,
              '输入为空时不显示输入框清空按钮',
              `实际 ${$$('.bmsearch__field .ico-btn').length}`,
            );

            setInput(sInput, 'github');
            await sleep(300);
            log(
              $$('.bmsearch__item').length === 1,
              '搜索列出命中的书签',
              `实际 ${$$('.bmsearch__item').length}`,
            );
            log(!!$('.bmsearch__name mark'), '命中关键词高亮显示');

            // 输入框里的 X：只清空字符，不关弹窗
            $('.bmsearch__field .ico-btn').click();
            await sleep(350);
            log(
              sInput.value === '',
              '输入框的 X 只清空输入内容',
              `value=${JSON.stringify(sInput.value)}`,
            );
            log(
              W.__tabnest.getState().searchOpen === true && !!$('.bmsearch'),
              '清空后弹窗仍处于打开状态',
              `state=${W.__tabnest.getState().searchOpen} box=${!!$('.bmsearch')}`,
            );

            setInput(sInput, '工作');
            await sleep(300);
            log(
              $$('.bmsearch__item').length >= 4,
              '搜「工作」同时命中文件夹与其下的书签',
              `实际 ${$$('.bmsearch__item').length}`,
            );

            setInput(sInput, 'zzz-不存在-zzz');
            await sleep(300);
            log(!!$('.bmsearch__hint'), '无结果时给出提示');

            setInput(sInput, 'github');
            await sleep(300);
            const tabsBeforeEnter = $$('[data-tab-card]').length;
            sInput.dispatchEvent(
              new W.KeyboardEvent('keydown', { key: 'Enter', bubbles: true, cancelable: true }),
            );
            await sleep(800);
            log(
              tabsBeforeEnter + 1 === $$('[data-tab-card]').length,
              'Enter 打开命中的书签（新标签页）',
              `${tabsBeforeEnter} → ${$$('[data-tab-card]').length}`,
            );
            // 键盘路径只断言状态层：headless 虚拟时间下 React 的提交流水线不同步，
            // DOM 是否真的卸载交给下面「真实点击关闭」那条来验
            log(
              W.__tabnest.getState().searchOpen === false,
              'Enter 后弹窗进入关闭态',
              `state=${W.__tabnest.getState().searchOpen} box=${!!$('.bmsearch')}`,
            );

            // 鼠标点击搜索结果：同样必须在新标签页打开
            $('.bm-search-btn').click();
            await sleep(400);
            const sInput2 = $('.bmsearch__field input');
            setInput(sInput2, 'github');
            await sleep(300);
            const tabsBeforeClick = $$('[data-tab-card]').length;
            $('.bmsearch__item').click();
            await sleep(800);
            log(
              tabsBeforeClick + 1 === $$('[data-tab-card]').length,
              '鼠标点击搜索结果在新标签页打开',
              `${tabsBeforeClick} → ${$$('[data-tab-card]').length}`,
            );
            log(
              !$('.bmsearch') || W.getComputedStyle($('.modal')).opacity === '0',
              '点击结果后弹窗收起',
              `box=${!!$('.bmsearch')}`,
            );

            // 真实点击右上角的 X：验证 DOM 真的卸载
            $('.bm-search-btn').click();
            await sleep(400);
            log(!!$('.bmsearch'), '再次点图标能重新打开弹窗');
            log(!!$('.bmsearch__close'), '弹窗右上角有独立关闭按钮');
            $('.bmsearch__close').click();
            await sleep(900);
            log(
              !$('.bmsearch') || W.getComputedStyle($('.modal')).opacity === '0',
              '点右上角 X 关闭弹窗并淡出',
              `box=${!!$('.bmsearch')}`,
            );

            // 快捷键：Ctrl+K 打开 / Esc 关闭
            D.dispatchEvent(
              new W.KeyboardEvent('keydown', {
                key: 'k',
                ctrlKey: true,
                bubbles: true,
                cancelable: true,
              }),
            );
            await sleep(500);
            log(
              W.__tabnest.getState().searchOpen === true,
              'Ctrl+K 打开搜索弹窗',
              `state=${W.__tabnest.getState().searchOpen}`,
            );
            D.dispatchEvent(
              new W.KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }),
            );
            await sleep(500);
            log(
              W.__tabnest.getState().searchOpen === false,
              'Esc 让搜索弹窗进入关闭态',
              `state=${W.__tabnest.getState().searchOpen} box=${!!$('.bmsearch')}`,
            );
            if ($('.bmsearch__close')) {
              $('.bmsearch__close').click();
              await sleep(700);
            }
          }

          /* ---------- 文件夹 ---------- */
          $('[data-tree-row="1"] .tree-caret').click();
          await sleep(250);
          log(
            $$('.tree-row').length < BASE_ROWS,
            '收起「收藏夹栏」后树行数减少',
            `${BASE_ROWS} → ${$$('.tree-row').length}`,
          );
          $('[data-tree-row="1"] .tree-caret').click();
          await sleep(250);
          log(
            $$('.tree-row').length === BASE_ROWS,
            '再次展开后树行数还原',
            `实际 ${$$('.tree-row').length} / 基准 ${BASE_ROWS}`,
          );
          $('[data-tree-row="1"]').click();
          $('[data-tree-row="11"]').click();
          await sleep(250);
          log($('.pane-main .sec-title').textContent === '工作', '点击文件夹切换当前目录', $('.pane-main .sec-title').textContent);
          log(!!$('.crumb'), '子文件夹显示面包屑', $('.crumb') ? $('.crumb').textContent : '');
          log(!!$('.subchips .chip'), '子文件夹显示为 chips');

          /* ---------- 新建草稿 ---------- */
          headerBtn('新建').click();
          await sleep(250);
          const draft = $('.bm-card.is-draft');
          log(!!draft, '新建后出现「未保存」草稿卡片');
          const draftName = $('.bm-card.is-draft input:not(.soft)');
          log(!!draftName && !!$('.bm-card.is-draft input.soft'), '新建后名称与网址同时变输入框');

          /* ---------- hover 扁平化：不抬升、不加外阴影，只换底色 ---------- */
          {
            const hoverFlat = [];
            const walkFlat = (rules) => {
              for (const r of rules) {
                if (r.selectorText) hoverFlat.push(r);
                if (r.cssRules) walkFlat(r.cssRules);
              }
            };
            for (const sheet of D.styleSheets) {
              try {
                walkFlat(sheet.cssRules);

                /* 跨域表跳过 */
              }

            const liftTargets = [
              '.tab-card:hover',

              '.row-menu__item:hover',

              '.tab-grid.select-mode .tab-card:not(.is-sel):hover',
              '.bm-grid.select-mode .bm-card:not(.is-sel):hover',
            ];
            for (const sel of liftTargets) {
              const rs = hoverFlat.filter((r) => r.selectorText === sel);
              if (!rs.length) {
                log(false, `找到 hover 规则 ${sel}`, '未找到');
                continue;
              }
              const bad = [];
              const noBg = [];
              for (const r of rs) {
                const tr = r.style.transform || '';
                if (tr && tr !== 'none') bad.push(`transform=${tr}`);
                // inset 阴影属于「文字下划线」一类的提示，不算抬升
                const sh = (r.style.boxShadow || '').replace(/inset[^,]*/g, '').trim();
                if (sh) bad.push(`box-shadow=${sh}`);
                const bg = r.style.background || r.style.backgroundColor || '';
                if (!bg || bg === 'none') noBg.push(sel);
              }
              log(
                bad.length === 0,
                `${sel} 扁平：不位移、不加外阴影`,
                bad.join(' / ') || rs[0].style.cssText,
              );
              log(noBg.length === 0, `${sel} 有底色变化`, noBg.length ? '缺少 background' : rs[0].style.background);
            }

          {
            const flat = [];

              }
            };
            for (const sheet of D.styleSheets) {

          const dragSteps = (srcEl, dstEl, ratio) => {
            const dt = new W.DataTransfer();
            const r = dstEl.getBoundingClientRect();
            const x = Math.round(r.left + r.width * ratio);
            const y = Math.round(r.top + r.height / 2);
            const fire = (type, target) =>
              target.dispatchEvent(
                new W.DragEvent(type, {
                  bubbles: true,
                  cancelable: true,
                  composed: true,
                  dataTransfer: dt,
                  clientX: x,
                  clientY: y,
                }),
              );
            return {
              dt,
              start: () => fire('dragstart', srcEl),
              over: () => {
                fire('dragenter', dstEl);
                fire('dragover', dstEl);
              },
              drop: () => {
                fire('drop', dstEl);
                fire('dragend', srcEl);
              },
            };

              '拖拽进行中写入全局拖拽态',
              `active=${d1.active} kind=${d1.kind} ids=${d1.ids.join()}`,
            );
            const ind = d1.indicator;
            log(
              ind?.kind === 'tab' && ind?.targetId === before[2] && ind?.side === 'after',
              '拖到卡片右半区显示「插入到右侧」',
              JSON.stringify(ind),
            );

            await sleep(500);
            const after = tabIds();
            const want = [before[1], before[2], before[0], ...before.slice(3)];
            log(after.join() === want.join(), '拖标签到右侧 → 卡片顺序更新', `${before.join()} → ${after.join()}`);
            log(
              W.__tabnest
                .getState()
                .tabs.map((t) => String(t.id))
                .join() === want.join(),
              '拖标签排序写入 store',
              W.__tabnest
                .getState()
                .tabs.map((t) => String(t.id))
                .join(),
            );

            // 反向再拖回来（左半区 before）

          {

            );

            {
              const ids0 = new Set(Q().map((s) => s.id));
              const used = new Set(Q().map((s) => normKey(s.url)));

                  Q().length === before + 1 && !!added,

                  `${before} → ${Q().length}`,

                log(
                  !!added && added.name === (normTxt(pick.title).slice(0, 24) || bareHost(pick.url)),
                  '新磁贴名称取自标签标题',
                  added ? added.name : '(没加上)',

                log(
                  !!added && $$('.quick-tile__nm').some((el) => el.textContent === added.name),
                  '新磁贴已渲染到快捷访问网格里',
                );
                log(
                  $$('[data-tab-card]').length === W.__tabnest.getState().tabs.length,
                  '拖到快捷访问只是复制：标签一个都没少',
                  `卡片 ${$$('[data-tab-card]').length} / store ${W.__tabnest.getState().tabs.length}`,
                );

                // 同一个标签再拖一次：按网址去重，不叠加
                const after = Q().length;
                nativeDrag(tabCell(String(pick.id)), pane, 0.5);
                await sleep(650);
                log(Q().length === after, '重复拖入同一网址 → 去重不叠加', `${after} → ${Q().length}`);
              }
            }

            // 书签卡片 → 快捷访问
            {
              const ids0 = new Set(Q().map((s) => s.id));
              const used = new Set(Q().map((s) => normKey(s.url)));
              const st0 = W.__tabnest.getState();
              const cell = $$('[data-bm-card]').find((el) => {
                const n = st0.bm.nodes[el.getAttribute('data-bm-card')];
                const u = normKey(n && n.url);
                return u && !INTERNAL.test(u) && !used.has(u);
              });
              log(
                !!cell,
                '拖拽前置：有还没加入快捷访问的书签卡片',
                cell ? cell.getAttribute('data-bm-card') : '(没有候选书签)',
              );
              if (cell) {
                const id = cell.getAttribute('data-bm-card');
                const node = W.__tabnest.getState().bm.nodes[id];
                const before = Q().length;
                nativeDrag(cell, pane, 0.5);
                await sleep(650);
                const added = newOnes(ids0).pop();
                log(
                  Q().length === before + 1,
                  '拖书签到快捷访问 → 新增一个磁贴',
                  `${before} → ${Q().length}`,
                );
                log(
                  !!added &&
                    added.url === node.url &&
                    added.name === (normTxt(node.title).slice(0, 24) || bareHost(node.url)),
                  '新磁贴名称 / 网址取自书签',
                  added ? `${added.name} · ${added.url}` : '(没加上)',
                );
                log(
                  !!W.__tabnest.getState().bm.nodes[id] && !!$(`[data-bm-card="${id}"]`),
                  '拖到快捷访问只是复制：书签原样留在列表里',
                );
              }
            }

            // 数量上限已移除：超过原上限 16 也照收
            {
              const before = Q().length;
              const st = W.__tabnest.getState();
              for (let i = 0; i < 20; i++) st.addQuick('上限测试' + i, `https://limit-test.dev/${i}`);
              await sleep(400);
              log(
                Q().length === before + 20 && Q().length > 16,
                '快捷访问没有数量上限（超过原上限 16 仍全部加入）',
                `${before} → ${Q().length}`,
              );
              log(
                $$('.quick-tile:not(.quick-tile--add)').length === Q().length,
                '磁贴数与数据一致',
                `磁贴 ${$$('.quick-tile:not(.quick-tile--add)').length} / 数据 ${Q().length}`,
              );
              // 收尾：删掉测试磁贴，别把后续用例的布局撑变形
              Q()
                .filter((s) => s.name.indexOf('上限测试') === 0)
                .forEach((s) => st.removeQuick(s.id));
              await sleep(300);
              log(
                $$('.quick-tile:not(.quick-tile--add)').length === Q().length,
                '清理测试磁贴后仍然一致',
                `磁贴 ${$$('.quick-tile:not(.quick-tile--add)').length} / 数据 ${Q().length}`,
              );
            }
          }

          /* ---------- 快捷磁贴拖拽排序 ---------- */
          {
            const Q = () => W.__tabnest.getState().quickSites;
            const tileIds = () => $$('[data-quick-tile]').map((el) => el.getAttribute('data-quick-tile'));
            const tile = (id) => $(`[data-quick-tile="${id}"]`);
            const storeIds = () => Q().map((s) => s.id);

            log(tileIds().length >= 3, '快捷排序前置：磁贴充足', tileIds().join());
            log(tile(tileIds()[0]).getAttribute('draggable') === 'true', '快捷磁贴注册为拖拽源');
            log(
              tile(tileIds()[0]).hasAttribute('data-drop-target-for-element'),
              '快捷磁贴注册为排序落点',
            );

            // 拖到目标磁贴左半区 = 插到它前面；顺带看拖拽中的视觉反馈
            {
              const before = tileIds();
              const g = dragSteps(tile(before[0]), tile(before[2]), 0.15);
              g.start();
              g.over();
              await sleep(240);
              log(tile(before[0]).classList.contains('dragging'), '拖拽中的磁贴原位半透明');
              log(
                tile(before[2]).classList.contains('drop-b'),
                '落点磁贴显示左侧插入线',
                tile(before[2]).className,
              );
              log(
                !$('.pane-quick.is-drop') && !$('.pane-quick .drop-hint'),
                '拖磁贴时不显示「松手加入」提示条',
              );
              g.drop();
              await sleep(420);

              const after = tileIds();
              const want = [before[1], before[0], before[2], ...before.slice(3)];
              log(
                after.join() === want.join(),
                '拖磁贴到左半区 → 磁贴顺序更新',
                `${before.slice(0, 3).join()} → ${after.slice(0, 3).join()}`,
              );
              log(storeIds().join() === want.join(), '排序结果已写回 store', storeIds().slice(0, 3).join());
              log(
                !$('.quick-tile.dragging') && !$('.quick-tile.drop-b') && !$('.quick-tile.drop-a'),
                '拖拽结束后磁贴高亮与插入线全部清除',
              );
            }

            // 拖到目标磁贴右半区 = 插到它后面
            {
              const before = tileIds();
              nativeDrag(tile(before[0]), tile(before[1]), 0.85);
              await sleep(650);
              const after = tileIds();
              const want = [before[1], before[0], ...before.slice(2)];
              log(
                after.join() === want.join(),
                '拖磁贴到右半区 → 插到该磁贴之后',
                `${before.slice(0, 2).join()} → ${after.slice(0, 2).join()}`,
              );
            }

            // 拖到本区空白（磁贴缝 / 最后一行空位）= 挪到末尾。
            // 注：无头合成事件下 pdnd 的 onDragStart 是延迟到 dragover 之后才跑，
            // drop 时拿不到行进中的落点表，所以这里只验「空白区认快捷磁贴为落点」，
            // 真正的落位结果用下一条「拖到末位磁贴右半区」来验（等价于插到最后）。
            {
              const g = dragSteps(tile(tileIds()[0]), $('.pane-quick'), 0.5);
              let recognized = false;
              const onOver = (e) => {
                if (e.target === $('.pane-quick') && e.defaultPrevented) recognized = true;
              };
              W.document.addEventListener('dragover', onOver);
              g.start();
              g.over();
              await sleep(200);
              log(
                recognized,
                '快捷访问区空白也认快捷磁贴为落点（拖到这里 = 挪到末尾）',
                `prevented=${recognized}`,
              );
              g.drop();
              await sleep(320);
              W.document.removeEventListener('dragover', onOver);
            }

            // 拖到末位磁贴右半区 → 挪到末尾
            {
              const before = tileIds();
              const last = before[before.length - 1];
              nativeDrag(tile(before[0]), tile(last), 0.9);
              await sleep(650);
              const after = tileIds();
              const want = [...before.slice(1), before[0]];
              log(
                after.join() === want.join(),
                '拖到末位磁贴右半区 → 挪到末尾',
                `期望 ${want.slice(-2).join()} / 实际 ${after.slice(-2).join()}`,
              );
            }

            // 串台防护：磁贴的 id 是 'q-xxx'，绝不能被当成书签 id 塞进书签树
            {
              const ids0 = tileIds();
              const bm0 = $$('[data-bm-card]').length;
              const nodes0 = Object.keys(W.__tabnest.getState().bm.nodes).length;
              nativeDrag(tile(ids0[0]), $$('[data-bm-card]')[0], 0.85);
              await sleep(650);
              log(
                tileIds().join() === ids0.join() &&
                  $$('[data-bm-card]').length === bm0 &&
                  Object.keys(W.__tabnest.getState().bm.nodes).length === nodes0,
                '快捷磁贴拖到书签网格 → 两边都不受影响',
                `磁贴 ${tileIds().length} / 书签 ${$$('[data-bm-card]').length}`,
              );
            }
          }

          /* ---------- 跨存储搬运（回归：账号书签与此设备书签曾禁止互移） ---------- */
          {
            const st = W.__tabnest.getState();
            st.gotoFolder('3');
            await sleep(400);
            const src = bmCell('300');
            const dst = $('[data-tree-row="2"]');
            log(!!src && !!dst, '跨存储搬运前置：设备书签与账号文件夹都在', `src=${!!src} dst=${!!dst}`);
            if (src && dst) {
              nativeDrag(src, dst, 0.5);
              await sleep(600);
              const bm = W.__tabnest.getState().bm;
              log(
                bm.nodes['300'] && bm.nodes['300'].parentId === '2',
                '设备书签拖进账号文件夹 → 允许并生效',
                `parentId=${bm.nodes['300'] && bm.nodes['300'].parentId}`,
              );
              log(
                bm.nodes['300'] && bm.nodes['300'].syncing === true,
                '搬进账号存储后归属重新标记',
                `syncing=${bm.nodes['300'] && bm.nodes['300'].syncing}`,
              );
              log(
                W.__tabnest.getState().currentFolder === '3',
                '搬运到别的文件夹后停留在原文件夹（不跟随跳转）',
                `currentFolder=${W.__tabnest.getState().currentFolder}`,
              );
            }
          }
          /* ---------- 主题（明亮 / 暗黑 / 跟随系统） ---------- */
          {
            const rgbDark = (v) => {
              const m = String(v).match(/(\d+),\s*(\d+),\s*(\d+)/);
              return !!m && +m[1] + +m[2] + +m[3] < 260;
            };
            const mode = () => W.__tabnest.getState().theme;
            const initial = mode();
            const btn = $('[data-row-menu="theme"]');
            log(!!btn, '主题入口在书签面板标题行右上角');
            const initialBg = W.getComputedStyle(D.body).backgroundColor;
            log(
              rgbDark(initialBg) === (D.documentElement.dataset.theme === 'dark'),
              '首屏底色与 html[data-theme] 一致（防闪烁那步生效）',
              `theme=${D.documentElement.dataset.theme} bg=${initialBg}`,
            );

            // 暗色 token 有两份声明（媒体查询兜底 + 属性选择器），必须逐字一致：
            // 媒体查询那份负责「React 还没落地」的首屏，属性那份负责显式选暗。
            {
              const bags = { media: new Map(), attr: new Map() };
              const scan = (rules, inMedia) => {
                for (const r of rules) {
                  if (r.media) scan(r.cssRules, true);
                  else if (r.selectorText && /data-theme/.test(r.selectorText)) {
                    const bag = inMedia ? bags.media : bags.attr;
                    for (const p of r.style) {
                      if (p.startsWith('--color-')) bag.set(p, r.style.getPropertyValue(p).trim());
                    }
                  }
                }
              };
              for (const sheet of D.styleSheets) {
                try {
                  scan(sheet.cssRules, false);
                } catch {
                  /* 跨域表跳过 */
                }
              }
              const keys = [...bags.attr.keys()];
              const diff = keys.filter((k) => bags.media.get(k) !== bags.attr.get(k));
              log(
                keys.length >= 20 && diff.length === 0,
                '暗色 token 两份声明逐项一致（媒体查询 / 属性）',
                diff.length
                  ? diff.map((k) => `${k}: ${bags.media.get(k)} vs ${bags.attr.get(k)}`).join(' | ')
                  : `${keys.length} 项一致`,
              );
              log(
                !!W.getComputedStyle(D.documentElement).getPropertyValue('--color-elevated').trim(),
                '派生 token 已定义（--color-elevated：浮层/输入框底色）',
              );
            }

            btn.click();
            await sleep(300);
            // 只认主题菜单那一个 portal：前面步骤（书签行「三个点」）的菜单节点
            // 可能还挂在 body 上（motion 出场动画在无头虚拟时间下不一定跑完），
            // 全局查 `.row-menu [data-row-item]` 会把 rename/child/remove 一起捞进来
            const themeMenu = $$('.row-menu')
              .filter((m) => m.querySelector('[data-row-item="system"]'))
              .pop();
            const opts = themeMenu
              ? [...themeMenu.querySelectorAll('[data-row-item]')].map((b) =>
                  b.getAttribute('data-row-item'),
                )
              : [];
            log(opts.join() === 'light,dark,system', '主题菜单列出三种模式', opts.join() || '菜单没出来');
            log(
              !!$(`[data-row-item="${initial}"] .row-menu__ck`),
              `当前模式（${initial}）带勾选标记`,
            );
            const other = initial === 'dark' ? 'light' : 'dark';
            log(!$(`[data-row-item="${other}"] .row-menu__ck`), `非当前模式（${other}）不打勾`);

            $('[data-row-item="dark"]').click();
            await sleep(340);
            log(mode() === 'dark', '选「暗黑」写入 store', `theme=${mode()}`);
            log(
              D.documentElement.dataset.theme === 'dark',
              '选「暗黑」→ html[data-theme=dark]',
              `dataset=${D.documentElement.dataset.theme}`,
            );
            const darkBg = W.getComputedStyle(D.body).backgroundColor;
            log(
              rgbDark(darkBg) && darkBg !== initialBg,
              '暗色下页面底色变暗',
              `${initialBg} → ${darkBg}`,
            );

            // 弹层曾是写死的 #fff：暗色下必须跟着深下去
            btn.click();
            await sleep(300);
            const menuBg = $('.row-menu') ? W.getComputedStyle($('.row-menu')).backgroundColor : '';
            log(rgbDark(menuBg), '暗色下弹出菜单是深色（原来写死 #fff）', menuBg || '菜单没出来');
            $('[data-row-item="light"]').click();
            await sleep(340);
            log(
              mode() === 'light' && !rgbDark(W.getComputedStyle(D.body).backgroundColor),
              '切回「明亮」还原亮底',
              `theme=${mode()} bg=${W.getComputedStyle(D.body).backgroundColor}`,
            );

            btn.click();
            await sleep(300);
            $('[data-row-item="system"]').click();
            await sleep(340);
            const sysDark = W.matchMedia('(prefers-color-scheme: dark)').matches;
            log(
              mode() === 'system' &&
                D.documentElement.dataset.theme === (sysDark ? 'dark' : 'light') &&
                D.documentElement.dataset.themeMode === 'system',
              '「跟随系统」按系统偏好解析',
              `系统${sysDark ? '暗' : '亮'}色 → data-theme=${D.documentElement.dataset.theme}`,
            );

            // 还原初始模式，免得下次跑探针时首屏主题不同（探针必须可重复跑）
            btn.click();
            await sleep(300);
            const back = $(`[data-row-item="${initial}"]`);
            log(!!back, `还原初始模式 ${initial}`, back ? '' : '菜单项缺失');
            if (back) back.click();
            await sleep(340);
            log(mode() === initial, '主题模式已还原', `theme=${mode()}`);
          }
          /* ---------- 网格空白处的排序落点（回归：拖到第一个位置没反应） ---------- */
          {
            const dropAt = (srcEl, x, y, dstEl) => {
              const dt = new W.DataTransfer();
              const fire = (type, target) =>
                target.dispatchEvent(
                  new W.DragEvent(type, {
                    bubbles: true,
                    cancelable: true,
                    composed: true,
                    dataTransfer: dt,
                    clientX: Math.round(x),
                    clientY: Math.round(y),
                  }),
                );
              fire('dragstart', srcEl);
              fire('dragenter', dstEl);
              fire('dragover', dstEl);
              return {
                snap: () => W.__tabnest.getState().drag,
                drop: () => {
                  fire('drop', dstEl);
                  fire('dragend', srcEl);
                },
              };
            };

            // 标签：把末张拖到第一张卡片「左边界外 3px」——指针最常见的落点
            {
              const grid = $('.tab-grid');
              const list = $$('[data-tab-card]');
              const src = list[list.length - 1];
              const r0 = list[0].getBoundingClientRect();
              const before = tabIds();
              const h = dropAt(src, r0.left - 3, r0.top + r0.height / 2, grid);
              await sleep(140);
              h.drop();
              await sleep(520);
              log(
                tabIds()[0] === before[before.length - 1],
                '拖标签到第一张左侧缝隙 → 卡片落到第一位',
                `${before[before.length - 1]} → 首位 ${tabIds()[0]}`,
              );

              const mid = $$('[data-tab-card]');
              const rm = mid[0].getBoundingClientRect();
              const r1 = mid[1].getBoundingClientRect();
              const h2 = dropAt(mid[mid.length - 1], (rm.right + r1.left) / 2, rm.top + rm.height / 2, grid);
              await sleep(140);
              h2.drop();
              await sleep(520);
              log(
                tabIds()[0] === mid[0].getAttribute('data-tab-card'),
                '拖标签到卡片列缝 → 插到缝左侧卡片之后（不再跳到末尾）',
                tabIds().slice(0, 3).join(),
              );
            }

            // 快捷磁贴：同一落点
            {
              const tiles = () => $$('[data-quick-tile]');
              const list = tiles();
              const src = list[list.length - 1];
              const r0 = list[0].getBoundingClientRect();
              const before = list.map((el) => el.getAttribute('data-quick-tile'));
              const h = dropAt(src, r0.left - 3, r0.top + r0.height / 2, $('.pane-quick'));
              await sleep(140);
              h.drop();
              await sleep(520);
              log(
                tiles()[0].getAttribute('data-quick-tile') === before[before.length - 1],
                '拖磁贴到第一张左侧缝隙 → 磁贴落到第一位',
                `${before[before.length - 1]} → 首位 ${tiles()[0].getAttribute('data-quick-tile')}`,
              );
            }

            // 书签：找一个书签 ≥3 个的文件夹再拖
            {
              const st0 = W.__tabnest.getState();
              const kidsOf = (fid) =>
                Object.values(st0.bm.nodes).filter((n) => n.parentId === fid && !n.isFolder);
              const fid = Object.keys(st0.bm.nodes).find(
                (id) => st0.bm.nodes[id]?.isFolder && kidsOf(id).length >= 3,
              );
              if (!fid) {
                log(false, '书签排序前置：找不到含 ≥3 个书签的文件夹');
              } else {
                st0.gotoFolder(fid);
                await sleep(420);
                const list = () => $$('[data-bm-card]');
                const src = list()[list().length - 1];
                const r0 = list()[0].getBoundingClientRect();
                const before = list().map((el) => el.getAttribute('data-bm-card'));
                const h = dropAt(src, r0.left - 3, r0.top + r0.height / 2, $('[data-bm-pane]'));
                await sleep(140);
                h.drop();
                await sleep(620);
                const after = list().map((el) => el.getAttribute('data-bm-card'));
                log(
                  after[0] === before[before.length - 1],
                  '拖书签到第一张左侧缝隙 → 卡片落到第一位',
                  `${before[before.length - 1]} → 首位 ${after[0]}`,
                );
              }
            }
          }
        } catch (err) {
          log(false, '脚本异常', err && err.message);
        }

        log(errors.length === 0, '运行期无 console 报错', errors.slice(0, 12).join(' | '));
        errors
          .filter((e) => e.startsWith('reject'))
          .slice(-10)
          .forEach((e) => out.push('DBGLOG  ' + e));
        document.title = 'DONE';
        logEl.textContent = out.join('\n');
      });
    </script>
  </body>
</html>
