<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: #fff;
      }
      iframe {
        position: absolute;
        width: 1680px;
        height: 900px;
        border: 0;
        transform: scale(2.4);
        transform-origin: top left;
        left: -2280px; /* -2.4 * 950  → 显示 x >= 950 */

      }
    </style>

    <iframe src="/src/newtab/index.html"></iframe>
  </body>
